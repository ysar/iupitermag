[package]
name = "iupitermag"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Rust crate for modeling Jupiter's internal and current sheet magnetic fields."
readme = "README.md"
repository = "https://github.com/ysar/iupitermag.git"
categories = ["science"]

[dependencies]
lazyivy = "0.6.5"
ndarray = { version = "0.17.2", features = ["rayon"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "bench_internal"
harness = false
